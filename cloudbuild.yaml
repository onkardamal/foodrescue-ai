steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/foodrescue-ai:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/foodrescue-ai:latest', '.']

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/foodrescue-ai:$SHORT_SHA']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/foodrescue-ai:latest']

images:
  - 'gcr.io/$PROJECT_ID/foodrescue-ai:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/foodrescue-ai:latest'

options:
  logging: CLOUD_LOGGING_ONLY
