steps:
  - name: 'gcr.io/cloud-builders/npm'
    args: ['install']
  
  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'build']
  
  - name: 'gcr.io/firebase-tools:latest'
    args: ['deploy', '--only', 'hosting']
    env:
      - 'FIREBASE_TOKEN=${_FIREBASE_TOKEN}'
      - 'PROJECT_ID=${PROJECT_ID}'

substitutions:
  _FIREBASE_TOKEN: ''

logsBucket: 'gs://${PROJECT_ID}_cloudbuild'

options:
  machineType: 'N1_HIGHCPU_8'
