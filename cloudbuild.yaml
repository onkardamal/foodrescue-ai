steps:
  # Install dependencies
  - name: 'node:18'
    entrypoint: npm
    args: ['install']
    env:
      - 'GEMINI_API_KEY=${_GEMINI_API_KEY}'
      - 'GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}'
      - 'FIREBASE_CONFIG=${_FIREBASE_CONFIG}'

  # Build the React application
  - name: 'node:18'
    entrypoint: npm
    args: ['run', 'build']
    env:
      - 'GEMINI_API_KEY=${_GEMINI_API_KEY}'
      - 'GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}'
      - 'FIREBASE_CONFIG=${_FIREBASE_CONFIG}'

  # Deploy to Firebase Hosting
  - name: 'node:18'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --token="${_FIREBASE_TOKEN}" --project="gen-lang-client-0558617691"
    env:
      - 'FIREBASE_TOKEN=${_FIREBASE_TOKEN}'

substitutions:
  _FIREBASE_TOKEN: ''
  _GEMINI_API_KEY: ''
  _GOOGLE_CLIENT_ID: ''
  _FIREBASE_CONFIG: ''

options:
  logging: CLOUD_LOGGING_ONLY
